[build-system]
requires = [
    "setuptools>=61.0",
    "wheel",
    "setuptools-scm>=8",
    "swig>=4.1,<4.5",
    "Cython",
    "numpy>=2.0,<2.5",
    "mpi4py",
]
build-backend = "setuptools.build_meta"

[project]
name = "gnrs"
dynamic = ["version"]
description = "A random molecular crystal structure generator"
readme = "README.md"
license = {text = "BSD-3-Clause"}
authors = [
    {name = "Yi Yang", email = "yiy5@andrew.cmu.edu"},
    {name = "Rithwik Tom"}
]
maintainers = [
    {name = "Yi Yang", email = "yiy5@andrew.cmu.edu"},
]
keywords = ["crystal structure", "molecular crystals", "crystal structure prediction", "materials science"]
requires-python = ">=3.11, <3.15"
dependencies = [
    "torch~=2.13.0",
    "numpy>=2.0,<2.5",
    "scipy>=1.15.0",
    "mpi4py",
    "ase>=3.26.0,<3.29",
    "spglib",
    "pymatgen>=2025.1.9",
    "scikit-learn",
    "pyyaml",
    "dscribe",
]

[project.optional-dependencies]  # add optional dependencies, e.g. to be installed as pip install .[uma]
uma = ["pandas", "fairchem-core"]
mace = ["pandas", "mace-torch"]
test = ["pytest", "packaging"]

[dependency-groups]
dev = ["ruff==0.16.10", "pre-commit==4.6.2"]

[project.scripts]
gnrs = "gnrs.cli:main"

[project.urls]
repository = "https://github.com/Yi5817/Genarris.git"
homepage = "https://www.noamarom.com/software/genarris"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: runs the full workflow under mpirun (slow; deselect with -m 'not integration')",
]

[tool.setuptools_scm]
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"
tag_regex = '^gnrs-(?P<version>\d+(?:\.\d+)*)$'

[tool.setuptools.packages.find]
include = ["gnrs*"]

[tool.setuptools.package-data]
"gnrs.parser" = ["*.yaml"]
"gnrs.gnrsutil" = ["*.yaml"]
"gnrs.cgenarris" = ["**/*.c", "**/*.h", "**/*.i", "VERSION"]
